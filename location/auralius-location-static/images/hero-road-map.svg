<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Illustrated road map to The Auralius</title>
  <desc id="map-desc">Animated hillside roads lead to one highlighted location near Dharampur.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233d32"/>
      <stop offset=".52" stop-color="#294638"/>
      <stop offset="1" stop-color="#152b26"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2=".75">
      <stop offset="0" stop-color="#71805a" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#344b3a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0f2924" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c7a8"/>
      <stop offset=".5" stop-color="#e5dbc2"/>
      <stop offset="1" stop-color="#aaa98d"/>
    </linearGradient>
    <filter id="soft-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="grain" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="8" r=".7" fill="#e2d4af" opacity=".12"/>
      <circle cx="29" cy="22" r=".6" fill="#0d211d" opacity=".24"/>
      <circle cx="15" cy="34" r=".5" fill="#e2d4af" opacity=".1"/>
    </pattern>
    <style>
      .contour { fill: none; stroke: #d4c796; stroke-width: 1.2; opacity: .12; }
      .minor-road { fill: none; stroke: #d6b981; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; opacity: .38; }
      .road-base { fill: none; stroke: #172c27; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
      .main-road { fill: none; stroke: #e8c98b; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1700; stroke-dashoffset: 1700; animation: route-draw 3.1s cubic-bezier(.3,.02,.18,1) .25s forwards; }
      .approach { fill: none; stroke: #f4d994; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 500; stroke-dashoffset: 500; animation: route-draw 1.6s ease 1.45s forwards; }
      .marker { opacity: 0; animation: marker-in .65s ease 2.5s forwards; }
      .halo { transform-box: fill-box; transform-origin: center; animation: beacon 3s ease-out 3s infinite; }
      @keyframes route-draw { to { stroke-dashoffset: 0; } }
      @keyframes marker-in { to { opacity: 1; } }
      @keyframes beacon { 0% { transform: scale(.5); opacity: .48; } 75%, 100% { transform: scale(2.2); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .main-road, .approach { animation: none; stroke-dashoffset: 0; }
        .marker { animation: none; opacity: 1; }
        .halo { animation: none; opacity: .22; }
      }
    </style>
  </defs>

